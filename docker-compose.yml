name: nibble

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nibble
      POSTGRES_PASSWORD: nibble
      POSTGRES_DB: nibble
    command:
      - postgres
      - -c
      - log_destination=stderr
      - -c
      - logging_collector=off
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
      - -c
      - log_statement=ddl
      - -c
      - log_checkpoints=on
      - -c
      - log_error_verbosity=verbose
      - -c
      - log_min_messages=info
    ports:
      # Host 5433 avoids conflict with a local PostgreSQL install on 5432 (common on Windows).
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nibble"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api-engine:
    build:
      context: ..
      dockerfile: nibble-local-dev/Dockerfile.api
    environment:
      DATABASE_URL: postgres://nibble:nibble@postgres:5432/nibble?sslmode=disable
      HTTP_ADDR: :8080
      GRPC_ADDR: :9090
      # Sign-in. Providers stay disabled until their credentials are set in .env.
      OAUTH_CALLBACK_BASE_URL: ${OAUTH_CALLBACK_BASE_URL:-http://localhost:5174/api}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GMAIL_TOKEN_ENCRYPTION_KEY: ${GMAIL_TOKEN_ENCRYPTION_KEY:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
    ports:
      # Host 8081/9091 avoid conflict with other local stacks on 8080/9090.
      - "8081:8080"
      - "127.0.0.1:9091:9090"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

  data-acquisition:
    build:
      context: ../nibble-data-acquisition
      dockerfile: Dockerfile.catalog
    environment:
      API_ENGINE_GRPC_ADDR: api-engine:9090
    restart: unless-stopped
    volumes:
      - catalog_snapshots:/snapshots
    depends_on:
      api-engine:
        condition: service_healthy

  web-platform:
    build:
      context: ../nibble-web-platform
      dockerfile: Dockerfile
    environment:
      API_ENGINE_URL: http://api-engine:8080
      VITE_MOCK: "0"
    ports:
      # Host 5174 avoids conflict with other Vite dev servers on 5173.
      - "5174:5173"
    depends_on:
      api-engine:
        condition: service_healthy

volumes:
  postgres_data:
  catalog_snapshots:
