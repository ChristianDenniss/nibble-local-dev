name: nibble

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nibble
      POSTGRES_PASSWORD: nibble
      POSTGRES_DB: nibble
    command:
      - postgres
      - -c
      - log_destination=stderr
      - -c
      - logging_collector=off
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
      - -c
      - log_statement=ddl
      - -c
      - log_checkpoints=on
      - -c
      - log_error_verbosity=verbose
      - -c
      - log_min_messages=info
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nibble -d nibble"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api-engine:
    build:
      context: ..
      dockerfile: nibble-local-dev/Dockerfile.api
    environment:
      DATABASE_URL: postgres://nibble:nibble@postgres:5432/nibble?sslmode=disable
      HTTP_ADDR: :8080
      GRPC_ADDR: :9090
    ports:
      - "8080:8080"
      - "127.0.0.1:9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

  data-acquisition:
    build:
      context: ..
      dockerfile: nibble-data-acquisition/Dockerfile.catalog
    environment:
      API_ENGINE_GRPC_ADDR: api-engine:9090
    restart: unless-stopped
    volumes:
      - catalog_snapshots:/snapshots
    depends_on:
      api-engine:
        condition: service_healthy

  web-platform:
    build:
      context: ../nibble-web-platform
      dockerfile: Dockerfile
    environment:
      API_ENGINE_URL: http://api-engine:8080
    ports:
      - "5173:5173"
    depends_on:
      api-engine:
        condition: service_healthy

volumes:
  postgres_data:
  catalog_snapshots:
