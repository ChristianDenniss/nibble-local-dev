name: doordash

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: doordash
      POSTGRES_PASSWORD: doordash
      POSTGRES_DB: doordash
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doordash -d doordash"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api-engine:
    build:
      context: ../api-engine
      dockerfile: Dockerfile
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN}
    environment:
      DATABASE_URL: postgres://doordash:doordash@postgres:5432/doordash?sslmode=disable
      HTTP_ADDR: :8080
      GRPC_ADDR: :9090
    ports:
      - "8080:8080"
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy

  data-acquisition:
    build:
      context: ../data-acquisition
      dockerfile: Dockerfile
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN}
    environment:
      API_ENGINE_GRPC_ADDR: api-engine:9090
    depends_on:
      - api-engine

  web-platform:
    build:
      context: ../web-platform
      dockerfile: Dockerfile
    environment:
      API_ENGINE_URL: http://api-engine:8080
    ports:
      - "5173:5173"
    depends_on:
      - api-engine

volumes:
  postgres_data:
