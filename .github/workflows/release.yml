name: Release

on:
  push:
    branches:
      - main
      - '[0-9]+.[0-9]+.x'
      - '[0-9]+.x'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Validate compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: nibble/nibble-local-dev
      - uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/nibble-api-engine
          path: nibble/nibble-api-engine
          token: ${{ secrets.GH_PAT }}
      - uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/nibble-data-acquisition
          path: nibble/nibble-data-acquisition
          token: ${{ secrets.GH_PAT }}
      - uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/nibble-web-platform
          path: nibble/nibble-web-platform
          token: ${{ secrets.GH_PAT }}
      - run: docker compose -f docker-compose.yml config
        working-directory: nibble/nibble-local-dev

  release:
    name: Tag & Release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install semantic-release tooling
        run: |
          npm install --no-save --no-package-lock \
            semantic-release@24.2.3 \
            @semantic-release/changelog@6.0.3 \
            @semantic-release/commit-analyzer@13.0.1 \
            @semantic-release/github@11.0.1 \
            @semantic-release/release-notes-generator@14.0.3 \
            conventional-changelog-conventionalcommits@8.0.0
      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
